name: Full Stack Conformance

on:
  push:
    branches:
      - master
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  conformance:
    name: Full Stack Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r conformance-harness/requirements.txt

      - name: Configure Conformance Suite hostname
        run: |
          echo "127.0.0.1 localhost.emobix.co.uk" | sudo tee -a /etc/hosts

      - name: Verify tools
        run: |
          java -version
          mvn -version
          python --version
          docker --version
          docker compose version

      - name: Run full-stack conformance
        run: |
          chmod +x run-full-stack-conformance.sh
          ./run-full-stack-conformance.sh --combined

      - name: Stop Docker services
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
